services:
  backend:
    build: ./server
    container_name: backend
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    networks:
      - mern-network
  frontend:
    build: 
      context: ./client 
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: frontend
    restart: always
    env_file:
      - ./client/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mern-network

  mongodb:
    image: mongo:8.2
    container_name: mongodb
    restart: always
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge